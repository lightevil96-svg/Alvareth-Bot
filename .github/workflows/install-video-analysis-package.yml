name: Install Video Analysis Package

on:
  push:
    branches: [main]
    paths:
      - 'tools/video-analysis-package.tar.gz.b64'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract and commit feature files
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/video-analysis-package.tar.gz.b64
          base64 --decode tools/video-analysis-package.tar.gz.b64 > /tmp/video-analysis-package.tar.gz
          tar -xzf /tmp/video-analysis-package.tar.gz -C .
          rm -f tools/video-analysis-package.tar.gz.b64 .github/workflows/install-video-analysis-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add WhatsApp video intelligence analyzer"
          git push origin HEAD:main

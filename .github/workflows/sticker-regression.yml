name: Sticker feature regression

on:
  push:
    branches: [main]
    paths:
      - 'plugins/sticker/**'
      - 'lib/simple.js'
      - 'tests/quoted-media.test.js'
      - 'tests/sticker-engine.test.js'
      - 'package.json'
      - 'lib/hermes-agent.js'
      - 'plugins/owner/hermes.js'
      - 'tests/hermes-agent.test.js'
      - '.github/workflows/hermes-regression.yml'
      - '.github/workflows/sticker-regression.yml'
  pull_request:
    paths:
      - 'plugins/sticker/**'
      - 'lib/simple.js'
      - 'tests/quoted-media.test.js'
      - 'tests/sticker-engine.test.js'
      - 'package.json'
      - 'lib/hermes-agent.js'
      - 'plugins/owner/hermes.js'
      - 'tests/hermes-agent.test.js'
      - '.github/workflows/hermes-regression.yml'
      - '.github/workflows/sticker-regression.yml'

jobs:
  sticker-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native build dependencies for canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev libpixman-1-dev libjpeg-dev libgif-dev librsvg2-dev ffmpeg fonts-liberation
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Run syntax and regression tests
        run: npm test

name: Temporary legacy branding audit

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit residual SC branding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan source text and file paths for legacy SC branding
        shell: bash
        run: |
          set +e
          echo "=== CONTENT MATCHES ==="
          git grep -n -I -i -E '(^|[^[:alpha:]])ryo([^[:alpha:]]|$)|yamada|bocchi[[:space:]_-]*the[[:space:]_-]*rock|ryoyamada|ryo[123]?\.(png|jpe?g|webp)|thumbnail\.jpg|ytta\.txt|source[[:space:]_-]*sc' -- . ':!LICENSE' ':!.github/workflows/legacy-branding-audit.yml'
          echo "=== LEGACY-LOOKING FILE PATHS ==="
          git ls-files | grep -i -E '(^|/)(ryo[^/]*|yamada[^/]*|ytta\.txt|thumbnail\.jpg)$'
          echo "=== ALL FILE PATHS CONTAINING RYO/YAMADA ==="
          git ls-files | grep -i -E 'ryo|yamada'

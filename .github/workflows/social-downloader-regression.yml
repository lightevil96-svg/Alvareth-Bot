name: Social downloader regression

on:
  push:
    branches: [main]
    paths:
      - 'plugins/downloader/ig.js'
      - 'plugins/downloader/twitter.js'
      - 'lib/scrape/youtube.js'
      - 'lib/scrape/twitter.js'
      - 'tests/social-downloaders.test.js'
      - 'package.json'
      - '.github/workflows/social-downloader-regression.yml'
  pull_request:
    paths:
      - 'plugins/downloader/ig.js'
      - 'plugins/downloader/twitter.js'
      - 'lib/scrape/youtube.js'
      - 'lib/scrape/twitter.js'
      - 'tests/social-downloaders.test.js'
      - 'package.json'

jobs:
  social-downloaders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check social downloader syntax and media-type regressions
        run: npm run test:social

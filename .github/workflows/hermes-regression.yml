name: Hermes Agent regression

on:
  push:
    branches: [main]
    paths:
      - "lib/hermes-agent.js"
      - "plugins/owner/hermes.js"
      - "tests/hermes-agent.test.js"
      - "package.json"
      - ".github/workflows/hermes-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/hermes-agent.js"
      - "plugins/owner/hermes.js"
      - "tests/hermes-agent.test.js"
      - "package.json"
      - ".github/workflows/hermes-regression.yml"

permissions:
  contents: read

jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Hermes bridge regression tests
        run: npm run test:hermes

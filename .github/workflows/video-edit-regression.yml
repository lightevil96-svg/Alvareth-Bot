name: Raw video edit regression

on:
  push:
    branches: [main]
    paths:
      - "video-edit/**"
      - "plugins/owner/edit.js"
      - "handler.js"
      - "tests/video-edit.test.js"
      - "tests/edit-whatsapp.test.js"
      - "package.json"
      - ".github/workflows/video-edit-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "video-edit/**"
      - "plugins/owner/edit.js"
      - "handler.js"
      - "tests/video-edit.test.js"
      - "tests/edit-whatsapp.test.js"
      - "package.json"
      - ".github/workflows/video-edit-regression.yml"

permissions:
  contents: read

jobs:
  video-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          ffmpeg -version
          ffprobe -version
      - name: Run raw video edit tests
        run: npm run test:edit

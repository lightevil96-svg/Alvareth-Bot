name: YouTube media and WhatsApp playback regression

on:
  push:
    branches: [main]
    paths:
      - 'plugins/downloader/clip.js'
      - 'plugins/downloader/ytmp4.js'
      - 'plugins/downloader/play.js'
      - 'plugins/downloader/clip-progress.js'
      - 'lib/scrape/youtube.js'
      - 'tests/clip-progress.test.js'
      - 'tests/clip-policy.test.js'
      - 'tests/youtube-video-output.test.js'
      - 'package.json'
      - 'skills/clip-editor/**'
      - 'docs/CLIP_EDITOR_SKILL.md'
      - '.github/workflows/clip-regression.yml'
  pull_request:
    paths:
      - 'plugins/downloader/clip.js'
      - 'plugins/downloader/ytmp4.js'
      - 'plugins/downloader/play.js'
      - 'plugins/downloader/clip-progress.js'
      - 'lib/scrape/youtube.js'
      - 'tests/clip-progress.test.js'
      - 'tests/youtube-video-output.test.js'
      - 'package.json'
      - 'skills/clip-editor/**'
      - 'docs/CLIP_EDITOR_SKILL.md'
      - '.github/workflows/clip-regression.yml'

jobs:
  clip-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg and FFprobe for real media regression
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Check YouTube clip and WhatsApp video playback
        run: npm run test:clip && npm run test:youtube-video && npm run test:skills-clip

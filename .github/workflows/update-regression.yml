name: Alvareth Updater Regression

on:
  push:
    branches: [main]
    paths:
      - 'plugins/owner/update.js'
      - 'lib/auto-update.js'
      - 'main.js'
      - 'package.json'
      - 'tests/auto-update.test.js'
      - 'tests/update-transport.test.js'
      - '.github/workflows/update-regression.yml'
  pull_request:
    paths:
      - 'plugins/owner/update.js'
      - 'tests/update-transport.test.js'
      - '.github/workflows/update-regression.yml'

jobs:
  updater:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check updater JavaScript syntax
        run: node --check plugins/owner/update.js && node --check lib/auto-update.js && node --check main.js
      - name: Test safe updater transport and automatic scheduling bridge
        run: node --test tests/update-transport.test.js tests/auto-update.test.js

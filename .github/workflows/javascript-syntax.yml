name: JavaScript syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check all JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -path './node_modules' -prune -o -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check

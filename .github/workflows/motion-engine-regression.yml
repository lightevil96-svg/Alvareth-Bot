name: Motion engine regression

on:
  push:
    branches: [main]
    paths:
      - "lib/motion-engine/**"
      - "lib/motion-project.js"
      - "lib/motion-qa.js"
      - "plugins/owner/motion.js"
      - "tests/motion-project.test.js"
      - "tests/motion-engine.test.js"
      - "tests/motion-qa.test.js"
      - "tests/motion-reference-analyzer.test.js"
      - "scripts/analyze-motion-reference.js"
      - "package.json"
      - ".github/workflows/motion-engine-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/motion-engine/**"
      - "lib/motion-project.js"
      - "lib/motion-qa.js"
      - "plugins/owner/motion.js"
      - "tests/motion-project.test.js"
      - "tests/motion-engine.test.js"
      - "tests/motion-qa.test.js"
      - "tests/motion-reference-analyzer.test.js"
      - "scripts/analyze-motion-reference.js"
      - "package.json"
      - ".github/workflows/motion-engine-regression.yml"

permissions:
  contents: read

jobs:
  motion-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Three.js for real geometry tests
        run: |
          mkdir -p "$RUNNER_TEMP/alvareth-three"
          npm install --prefix "$RUNNER_TEMP/alvareth-three" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund three@0.170.0
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/alvareth-three/node_modules/three" node_modules/three
      - name: Run .motion engine and render regressions
        run: |
          npm run test:motion
          npm run test:render

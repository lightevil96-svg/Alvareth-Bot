name: Video Studio regression

on:
  push:
    branches: [main, feat/remotion-whatsapp-linux]
    paths:
      - "video-studio/**"
      - "prompt-remotion.md"
      - "tests/video-studio*.js"
      - "tests/remotion-whatsapp.test.js"
      - "tests/voxcpm_service_test.py"
      - "scripts/remotion-smoke.js"
      - "scripts/setup-video-studio-linux.sh"
      - "scripts/setup-edge-tts-linux.sh"
      - "plugins/owner/remotion.js"
      - "tests/video-studio-media.test.js"
      - ".github/workflows/video-studio-regression.yml"
  pull_request:
    branches: [main, feat/remotion-whatsapp-linux]
    paths:
      - "video-studio/**"
      - "prompt-remotion.md"
      - "tests/video-studio*.js"
      - "tests/remotion-whatsapp.test.js"
      - "tests/voxcpm_service_test.py"
      - "scripts/remotion-smoke.js"
      - "scripts/setup-video-studio-linux.sh"
      - "plugins/owner/remotion.js"
      - ".github/workflows/video-studio-regression.yml"

permissions:
  contents: read

jobs:
  video-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 libegl1 libgl1 libgles2 libgl1-mesa-dri mesa-vulkan-drivers
          ffmpeg -version
          ffprobe -version
      - name: Check Video Studio JavaScript modules
        run: |
          bash -n scripts/setup-video-studio-linux.sh
          bash -n scripts/setup-edge-tts-linux.sh
          node --check video-studio/local-services.js
          node --check video-studio/installer.js
          node --check video-studio/prompt/storyboard.js
          node --check video-studio/prompt/compile.js
          node --check video-studio/voice-settings.js
          node --check video-studio/validate.js
          node --check video-studio/queue.js
          node --check video-studio/renderer.js
          node --check video-studio/media/voiceover.js
          node --check video-studio/remotion/text-layout.js
          node --check video-studio/media/ai-video.js
          python3 -m py_compile video-studio/services/edge_tts/synthesize.py
          node --check video-studio/media/comfyui.js
          node --check video-studio/media/ai-video.js
          node --check video-studio/media/pipeline.js
          node --check video-studio/whatsapp.js
          node --check plugins/owner/remotion.js
          node --check server.js
      - name: Install isolated renderer dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/remotion-render"
          npm install --prefix "$RUNNER_TEMP/remotion-render" --ignore-scripts --no-package-lock remotion@4.0.540 @remotion/bundler@4.0.540 @remotion/renderer@4.0.540 @remotion/layout-utils@4.0.540 @remotion/three@4.0.540 @react-three/fiber@9.8.2 three@0.187.0 react@19.2.0 react-dom@19.2.0
          ln -s "$RUNNER_TEMP/remotion-render/node_modules" node_modules
      - name: Compile the Remotion JSX entrypoint
        run: npx -y esbuild@0.25.0 video-studio/remotion/index.jsx --bundle --platform=browser --external:react --external:remotion --outfile=/tmp/video-studio-entry-check.js
      - name: Run Video Studio regression tests
        run: node --test tests/video-studio.test.js tests/video-studio-media.test.js tests/video-studio-voice.test.js tests/video-studio-typography.test.js tests/remotion-whatsapp.test.js tests/video-studio-local.test.js tests/video-studio-installer.test.js
      - name: Test Python voice service contract (mock inference)
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Render and decode real MP4 from fixed storyboard (no AI inference)
        env:
          VIDEO_STUDIO_RENDER_CONCURRENCY: '1'
        run: |
          node scripts/remotion-smoke.js --fixture
          ffmpeg -v error -i /tmp/alvareth-remotion-smoke/smoke.mp4 -ss 1 -frames:v 1 /tmp/alvareth-remotion-smoke/frame-1.png
          ffmpeg -v error -i /tmp/alvareth-remotion-smoke/smoke.mp4 -ss 4 -frames:v 1 /tmp/alvareth-remotion-smoke/frame-4.png
          ffmpeg -hide_banner -i /tmp/alvareth-remotion-smoke/smoke.mp4 -af volumedetect -vn -f null - 2> /tmp/alvareth-remotion-smoke/audio-levels.txt
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-fixture-render
          path: /tmp/alvareth-remotion-smoke/
          retention-days: 7

name: Install official Remotion Agent Skills

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-remotion-skills.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-remotion-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the complete official Remotion skill collection
        run: npx -y skills@latest add remotion-dev/skills --all -y
      - name: Commit installed project skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new skill files were produced."
            exit 1
          fi
          git commit -m "Install official Remotion Agent Skills"
          git push origin HEAD:main
